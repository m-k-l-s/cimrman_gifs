[project]
name = "cimrman-gifs"
version = "0.1.0"
description = "Validated, deterministic media catalog for the Cimrman GIF browser"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[dependency-groups]
dev = [
  "prek>=0.5.3",
  "ruff>=0.16.8",
  "ty>=0.0.82",
]
